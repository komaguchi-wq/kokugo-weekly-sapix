<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>SapiX 国語</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <!-- カテゴリ一覧画面 -->
  <div id="screen-categories" class="screen active">
    <header class="header">
      <a class="btn-portal-top" href="https://komaguchi-wq.github.io/study-portal/">🏠 学習ポータルTOPへ</a>
      <h1 class="header-title">📘 SapiX 国語</h1>
      <a class="btn-portal-top" href="https://komaguchi-wq.github.io/kokugo/">📖 国語トップ</a>
    </header>
    <div class="unit-list" id="category-list"><p class="loading">読み込み中…</p></div>
  </div>

  <!-- 単元一覧画面 -->
  <div id="screen-units" class="screen">
    <header class="header">
      <button class="btn-icon" id="btn-back-categories">←</button>
      <h1 class="header-title" id="units-header-title">単元一覧</h1>
    </header>
    <div class="unit-list" id="unit-list"></div>
  </div>

  <!-- 単元画面（問題/解答タブ + 正誤表 + ページ） -->
  <div id="screen-unit" class="screen">
    <header class="header">
      <button class="btn-icon" id="btn-back-units">←</button>
      <h1 class="header-title" id="unit-title"></h1>
      <button id="wsm-print-btn" title="表示中のタブを印刷">🖨 印刷</button>
    </header>
    <div class="wsm-fixed-top">
      <div class="wsm-modebar" id="wsm-modebar">
        <button class="wsm-mode-btn active" data-wsm-mode="all">全ての問題</button>
        <button class="wsm-mode-btn" data-wsm-mode="below50">正答率50%未満</button>
        <button class="wsm-mode-btn" data-wsm-mode="below67">正答率66%未満</button>
        <button class="wsm-mode-btn" data-wsm-mode="below99">正答率80%未満</button>
        <button class="wsm-mode-btn" data-wsm-mode="unanswered">未解答問題</button>
      </div>
      <div class="wsm-tabbar">
        <button class="wsm-tab active" id="wsm-tab-q">問題</button>
        <button class="wsm-tab" id="wsm-tab-a">解答</button>
      </div>
      <div class="wsm-table-title" id="wsm-table-toggle" role="button"><span>正誤表（小問ごとに ○ / ✕）</span><span class="wsm-table-chev">▽ 広げる</span></div>
      <div class="wsm-table" id="wsm-table"></div>
      <div class="wsm-divider" id="wsm-divider" title="ドラッグで正誤表の高さを変える"><span></span></div>
    </div>
    <div class="wsm-pages" id="wsm-pages"><div id="wsm-pages-inner"></div></div>
  </div>

  <!-- プリントオーバーレイ（画面上は不可視・@media print で印刷対象） -->
  <div id="print-overlay">
    <div id="print-overlay-body"></div>
  </div>

  <script src="app.js?v=12"></script>
</body>
</html>
